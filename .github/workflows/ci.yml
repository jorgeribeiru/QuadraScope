name: QuadraScope CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.11.7'
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/contracts/package-lock.json
      - name: Instalar pelos locks
        run: make install
      - name: Ciência, API, artefatos, contratos e frontend
        run: make ci
      - name: Instalar Chromium
        run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: Navegador com API e dados reais
        run: npm run test:e2e --prefix frontend
      - name: Preparar e conferir pacote de entrega
        run: make delivery
