[project]
name = "quadrascope"
version = "0.1.0"
description = "Relatório científico interativo Atlanta Hawks × Houston Rockets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18",
    "pydantic>=2.10,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "unit: configuração e componentes isolados",
    "analytics: cálculos científicos e propriedades dos dados",
    "api: contratos e integração HTTP",
]
